name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova & Build APK
        run: |
          npm install -g cordova
          cordova create myApp com.example.app MyApp
          cp -r index.html css js myApp/www/ 2>/dev/null || cp -r * myApp/www/ 2>/dev/null || true
          cd myApp
          cordova platform add android
          cordova build android --no-telemetry

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: "App Release v1.0.${{ github.run_number }}"
          files: "myApp/platforms/android/app/build/outputs/apk/debug/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
